name: Documentation improvement
description: Suggest a clarification, correction, or new documentation page.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve M3HT4 documentation.
        Do not include credentials, keys, tokens, public origin addresses, or live infrastructure details.
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
      placeholder: Describe the documentation problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      placeholder: Explain the change you recommend.
    validations:
      required: true

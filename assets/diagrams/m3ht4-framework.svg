<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">M3HT4 framework overview</title><desc id="desc">Three teams connected to four pillars around a shared modern hunting terrain.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111d"/><stop offset="1" stop-color="#02060b"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)" stroke="#123b5d"/>
<text x="600" y="54" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">M3HT4 — MODERN HUNTING TERRAIN</text>
<text x="600" y="86" fill="#47ccff" font-family="Arial, sans-serif" font-size="18" letter-spacing="3" text-anchor="middle">BUILT FOR 3 TEAMS · POWERED BY 4 PILLARS</text>
<circle cx="600" cy="290" r="116" fill="#081a29" stroke="#11c8ff" stroke-width="3" filter="url(#glow)"/>
<text x="600" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">SHARED</text>
<text x="600" y="310" fill="#47ccff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">TERRAIN</text>
<text x="600" y="339" fill="#9fb7c8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Behavior · Data · Evidence · Improvement</text>
<!-- team connectors -->
<path d="M485 235 L345 170" stroke="#1eb9ff" stroke-width="3"/><path d="M715 235 L855 170" stroke="#ff4c5f" stroke-width="3"/><path d="M600 406 L600 482" stroke="#ad68ff" stroke-width="3"/>
<!-- teams -->
<g font-family="Arial, sans-serif" text-anchor="middle"><rect x="120" y="112" width="250" height="104" rx="18" fill="#082a47" stroke="#1eb9ff" stroke-width="2"/><text x="245" y="152" fill="#59cfff" font-size="23" font-weight="700">BLUE TEAM</text><text x="245" y="182" fill="#dbefff" font-size="15">Observe · Hunt · Detect</text>
<rect x="830" y="112" width="250" height="104" rx="18" fill="#3b1119" stroke="#ff4c5f" stroke-width="2"/><text x="955" y="152" fill="#ff6574" font-size="23" font-weight="700">RED TEAM</text><text x="955" y="182" fill="#ffe5e8" font-size="15">Plan · Emulate · Explain</text>
<rect x="475" y="456" width="250" height="80" rx="18" fill="#29153c" stroke="#ad68ff" stroke-width="2"/><text x="600" y="490" fill="#c89aff" font-size="23" font-weight="700">PURPLE TEAM</text><text x="600" y="517" fill="#f2e7ff" font-size="15">Connect · Validate · Improve</text></g>
<!-- pillars -->
<g font-family="Arial, sans-serif" text-anchor="middle"><rect x="65" y="315" width="190" height="70" rx="14" fill="#081a29" stroke="#14d7ff"/><text x="160" y="358" fill="#fff" font-size="22" font-weight="700">HUNT</text>
<rect x="275" y="315" width="190" height="70" rx="14" fill="#081a29" stroke="#14d7ff"/><text x="370" y="358" fill="#fff" font-size="22" font-weight="700">DETECT</text>
<rect x="735" y="315" width="190" height="70" rx="14" fill="#081a29" stroke="#14d7ff"/><text x="830" y="358" fill="#fff" font-size="22" font-weight="700">EMULATE</text>
<rect x="945" y="315" width="190" height="70" rx="14" fill="#081a29" stroke="#14d7ff"/><text x="1040" y="358" fill="#fff" font-size="22" font-weight="700">TRAIN</text></g>
</svg>

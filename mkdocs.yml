site_name: M3HT4 — Modern Hunting Terrain
site_description: An interactive cybersecurity framework for Blue, Red, and Purple teams.
site_url: https://m3ht4.com/
repo_url: https://github.com/MehtaPar/M3HT4
repo_name: MehtaPar/M3HT4

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tooltips
  palette:
    - scheme: slate
      primary: black
      accent: light blue
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Framework:
      - Platform Vision: platform-vision.md
      - Operating Model: operations-model.md
      - Project Status: project-status.md
      - Roadmap: roadmap.md
      - Technology Strategy: technology-stack.md
  - Existing Documentation:
      - Documentation Hub: README.md
      - Architecture: architecture/README.md
      - Recovery: recovery/backup-and-recovery.md
      - Security: security/publication-safety.md
